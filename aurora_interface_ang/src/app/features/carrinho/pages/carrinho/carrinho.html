<div class="conteiner_carrinho_geral">
  <h1>Carrinho</h1>
  <div class="conteiner_carinhos_dados">
    <div class="conteiner_carrinho_produtos">
      <div class="conteiner_mensagem">
        <figure><img [src]="assetUrl('carrinho_512x512.png')" alt="" /></figure>
        <h2>Seu carrinho está vazio!</h2>
        <p>
          Ainda não há nada por aqui. Que tal dar uma olhada em nossos
          produtos incríveis e começar a preencher seu carrinho?
        </p>
      </div>
    </div>

    <div class="conteiner_carrinho_info">
      <h2>Resumo do Pedido</h2>
      <div class="conteiner_carrinho_detalhes">
        <div class="produto">
          <p>Produto(0):</p>
          <p>R$ 0</p>
        </div>
        <div class="total">
          <p>Total:</p>
          <p>R$ 0</p>
        </div>
      </div>

      <button type="button">Continuar</button>
    </div>
  </div>
</div>
